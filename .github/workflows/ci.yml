name: CI

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [development]

# Minimal permissions by default
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  authorship:
    name: Authorship
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # PR texts go through environment variables, never interpolated into the script (prevents injection)
      - name: No AI signatures and correct author
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='co-authored-by:|generated (with|by) \[?(claude|cursor|copilot|codex)|claude-session:|noreply@anthropic|claude\.ai/code|claude\.com/claude-code|🤖'
          failed=0
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "::error::The PR title or description contains AI signatures."; failed=1
          fi
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: commit authors are not checked."; exit $failed
          fi
          while IFS='|' read -r sha email committer; do
            # Dependabot commits already merged into development (committed by GitHub)
            if [ "$email" = "49699333+dependabot[bot]@users.noreply.github.com" ] && [ "$committer" = "noreply@github.com" ]; then
              echo "Dependabot commit $sha: accepted."
              if git log -1 --format=%B "$sha" | grep -Eiq "$pattern"; then
                echo "::error::Commit $sha contains AI signatures in the message."; failed=1
              fi
              continue
            fi
            if [ "$email" != "serbenda@gmail.com" ]; then
              echo "::error::Commit $sha has author '$email' (must be serbenda@gmail.com)."; failed=1
            fi
            # noreply@github.com: commits made from the GitHub web UI
            if [ "$committer" != "serbenda@gmail.com" ] && [ "$committer" != "noreply@github.com" ]; then
              echo "::error::Commit $sha has committer '$committer'."; failed=1
            fi
            if git log -1 --format=%B "$sha" | grep -Eiq "$pattern"; then
              echo "::error::Commit $sha contains AI signatures in the message."; failed=1
            fi
          done < <(git log --no-merges --format='%h|%ae|%ce' "$BASE..$HEAD")
          [ $failed -eq 0 ] && echo "✓ Correct authorship and no AI signatures."
          exit $failed

  hook:
    name: Hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Shell scripts
        run: shellcheck --severity=error scripts/*.sh .claude/hooks/*.sh .githooks/*

      - name: Security hook tests
        run: bash scripts/test-guard.sh

  # When the stack is chosen (phase P03, see the stack checklist in docs/SETUP.md), add a job here with the project's tests and lint,
  # the same commands as "Verify" in docs/SETUP.md.
