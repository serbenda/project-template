name: CI

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [development]

# Permisos mínimos por defecto
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lista los commits de la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  autoria:
    name: Autoría
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Los textos de la PR van por variables de entorno, nunca interpolados en el script (evita inyección)
      - name: Sin firmas de IA y autor correcto
        env:
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_CUERPO: ${{ github.event.pull_request.body }}
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          patron='co-authored-by:|generated (with|by) \[?(claude|cursor|copilot|codex)|claude-session:|noreply@anthropic|claude\.ai/code|claude\.com/claude-code|🤖'
          fallo=0
          if printf '%s\n%s' "$PR_TITULO" "$PR_CUERPO" | grep -Eiq "$patron"; then
            echo "::error::El título o la descripción de la PR contiene firmas de IA."; fallo=1
          fi
          if [ "$PR_AUTOR" = "dependabot[bot]" ]; then
            echo "PR de Dependabot: no se comprueba el autor de los commits."; exit $fallo
          fi
          while IFS='|' read -r sha email committer; do
            # Commits de Dependabot ya fusionados en development (los confirma GitHub)
            if [ "$email" = "49699333+dependabot[bot]@users.noreply.github.com" ] && [ "$committer" = "noreply@github.com" ]; then
              echo "Commit $sha de Dependabot: se acepta."
              if git log -1 --format=%B "$sha" | grep -Eiq "$patron"; then
                echo "::error::Commit $sha contiene firmas de IA en el mensaje."; fallo=1
              fi
              continue
            fi
            if [ "$email" != "serbenda@gmail.com" ]; then
              echo "::error::Commit $sha con autor '$email' (debe ser serbenda@gmail.com)."; fallo=1
            fi
            # noreply@github.com: commits hechos desde la web de GitHub
            if [ "$committer" != "serbenda@gmail.com" ] && [ "$committer" != "noreply@github.com" ]; then
              echo "::error::Commit $sha con committer '$committer'."; fallo=1
            fi
            if git log -1 --format=%B "$sha" | grep -Eiq "$patron"; then
              echo "::error::Commit $sha contiene firmas de IA en el mensaje."; fallo=1
            fi
          done < <(git log --no-merges --format='%h|%ae|%ce' "$BASE..$HEAD")
          [ $fallo -eq 0 ] && echo "✓ Autoría correcta y sin firmas de IA."
          exit $fallo

  hook:
    name: Hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Scripts de shell
        run: shellcheck --severity=error scripts/*.sh .claude/hooks/*.sh .githooks/*

      - name: Pruebas del hook de seguridad
        run: bash scripts/test-guardia.sh

  # Al decidir el stack (fase F03), añade aquí un job con las pruebas y el lint del proyecto,
  # los mismos comandos que "Verificar" en docs/SETUP.md.
