<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">project-template</title>
  <desc id="d">A Claude Code template for starting any new project: project memory, a phased workflow and layered security.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1a1240"/>
      <stop offset="1" stop-color="#3a1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <!-- terminal window -->
  <g transform="translate(820 70)">
    <rect width="380" height="220" rx="16" fill="#0d1222" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="24" r="6" fill="#febc2e"/>
    <circle cx="66" cy="24" r="6" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="24" y="74" fill="#8b93b8">$</text><text x="44" y="74" fill="#e8eaf6">/status</text>
      <text x="24" y="106" fill="#8b93b8">$</text><text x="44" y="106" fill="#e8eaf6">/new-phase</text><text x="160" y="106" fill="#ffb27a">login</text>
      <text x="24" y="138" fill="#28c840">✓</text><text x="44" y="138" fill="#b9c0de">plan approved · tests green</text>
      <text x="24" y="170" fill="#8b93b8">$</text><text x="44" y="170" fill="#e8eaf6">/prepare-pr</text>
      <text x="24" y="202" fill="#28c840">✓</text><text x="44" y="202" fill="#b9c0de">6/6 checks · ready to merge</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#ffb27a" font-size="20" font-weight="600" letter-spacing="4">CLAUDE CODE TEMPLATE</text>
    <text x="70" y="172" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-1.5">project-template</text>
    <rect x="72" y="194" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="244" fill="#c9cde6" font-size="24">Start any new project with memory, a method</text>
    <text x="72" y="276" fill="#c9cde6" font-size="24">and security that doesn't depend on luck.</text>
  </g>

  <!-- pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="300" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="147" y="321" fill="#e8eaf6" text-anchor="middle">Project memory</text>
    <rect x="234" y="300" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="309" y="321" fill="#e8eaf6" text-anchor="middle">Light · Full mode</text>
    <rect x="396" y="300" width="170" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="481" y="321" fill="#e8eaf6" text-anchor="middle">Layered security</text>
    <rect x="578" y="300" width="160" height="32" rx="16" fill="#d97757" fill-opacity="0.22" stroke="#ffb27a" stroke-opacity="0.6"/>
    <text x="658" y="321" fill="#ffd9c2" text-anchor="middle">Any stack</text>
  </g>
</svg>
