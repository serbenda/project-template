name: 🐞 Error
description: Algo no funciona como debería
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el error.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a...
        2. Pulsar...
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador y dispositivo
      placeholder: "Ej.: Chrome 130 en Android"
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o errores de consola
