version: 2
updates:
  # Keeps the GitHub Actions of the workflows up to date (they are pinned to a commit SHA, so
  # nothing updates them otherwise). This part doesn't depend on the stack; in phase P03 add the
  # stack's ecosystem (npm, pip, gomod, cargo, pub…) below (see docs/SETUP.md → Stack checklist).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a week before proposing a newly published version: a compromised release is usually
    # caught and pulled within days. Keep this block on every ecosystem added in phase P03.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
